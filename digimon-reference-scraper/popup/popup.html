<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 8px 0;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h3>Card Scraper</h3>
  <button id="scrapeBtn">Download All Images</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
