<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    .progress-container {
      display: none;
      margin-top: 12px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: #e5e7eb;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: #2563eb;
      transition: width 0.2s ease;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #555;
      word-break: break-word;
    }
    #countInfo {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #1e40af;
      text-align: right;
    }
  </style>
  <script src="jszip.min.js"></script>
</head>
<body>
  <h3>Card ZIP Downloader</h3>
  <button id="scrapeBtn">Scrape All Pages & Download ZIP</button>

  <div class="progress-container" id="progressContainer">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div id="countInfo">0%</div>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
